<style>
  .forgot-password-container {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #ffffff;
    padding: 60px 20px 40px 20px;
  }

  /* Lado izquierdo - Formulario */
  .forgot-left {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .forgot-form-wrapper {
    width: 100%;
  }

  .forgot-logo {
    width: 280px;
    height: auto;
    margin: 0 auto 24px auto;
    display: block;
  }

  .forgot-icon {
    width: 70px;
    height: 70px;
    margin: 0 auto 20px auto;
    display: block;
    color: #fdbe02;
  }

  .forgot-title {
    font-family: 'Aristotelica Display Trial', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    font-size: 42px;
    font-weight: 200;
    color: #333;
    margin-bottom: 12px;
    margin-left: 0;
    line-height: 1.2;
    text-align: center;
  }

  .forgot-subtitle {
    font-size: 15px;
    color: #666;
    margin-bottom: 24px;
    line-height: 1.6;
    text-align: center;
  }

  .forgot-form .form-group {
    margin-bottom: 18px;
    position: relative;
  }

  .forgot-form label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
  }

  .forgot-form input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    transition: all 0.3s ease;
    background: #ffffff;
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }

  .forgot-form input:focus {
    outline: none;
    border-color: #fdbe02;
    background: #ffffff;
  }

  .forgot-btn {
    width: 100%;
    padding: 16px;
    background: #fdbe02;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 8px;
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }

  .forgot-btn:hover {
    background: #e6a802;
  }

  .forgot-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
  }

  .forgot-footer {
    text-align: center;
    margin-top: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }

  .forgot-footer a {
    color: #fdbe02;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: color 0.3s ease;
  }

  .forgot-footer a:hover {
    color: #e6a802;
    text-decoration: underline;
  }

  .forgot-footer-separator {
    color: #666;
    font-weight: 400;
  }

  /* Lado derecho - Oculto */
  .forgot-right {
    display: none;
  }

  #forgot-message-area {
    margin-bottom: 20px;
  }

  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }

  .alert-error {
    background: #fee;
    color: #c33;
    border: 1px solid #fcc;
  }

  .alert-success {
    background: #efe;
    color: #3c3;
    border: 1px solid #cfc;
  }

  .alert-info {
    background: #e7f3ff;
    color: #0066cc;
    border: 1px solid #b3d9ff;
  }
</style>

<section class="forgot-password-container">
  <!-- Lado izquierdo: Formulario -->
  <div class="forgot-left">
    <div class="forgot-form-wrapper">
      <img src="assets/img/logos/LOGOTIPO_para-fondoblanco.png" alt="AtrapaBono" class="forgot-logo">
      
      <!-- Icono de información con candado -->
      <svg class="forgot-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <!-- Burbuja de información -->
        <path d="M20 25 C20 18, 25 13, 32 13 L56 13 C63 13, 68 18, 68 25 L68 45 C68 52, 63 57, 56 57 L32 57 C25 57, 20 52, 20 45 Z" fill="none"/>
        <path d="M32 57 L28 65 L35 57" fill="none"/>
        
        <!-- Letra i -->
        <circle cx="44" cy="27" r="3" fill="currentColor" stroke="none"/>
        <line x1="44" y1="35" x2="44" y2="48" stroke-width="4"/>
        
        <!-- Candado -->
        <rect x="58" y="48" width="24" height="20" rx="3" fill="none"/>
        <path d="M62 48 L62 43 C62 38, 66 34, 70 34 C74 34, 78 38, 78 43 L78 48" fill="none"/>
        <circle cx="70" cy="58" r="2" fill="currentColor" stroke="none"/>
      </svg>
      
      <h2 class="forgot-title">¿Olvidaste tu contraseña?</h2>
      <p class="forgot-subtitle">Ingresá tu correo electrónico y seguí las instrucciones que te enviaremos por correo.</p>

      <div id="forgot-message-area"></div>

      <form id="forgot-password-form" class="forgot-form">
        <div class="form-group">
          <label for="forgot-email">Correo Electrónico</label>
          <input 
            type="email" 
            id="forgot-email" 
            name="email" 
            placeholder="tu@email.com"
            required
          />
        </div>
        <button type="submit" class="forgot-btn" id="forgot-submit-btn">
          Continuar
        </button>
        
        <div class="forgot-footer">
          <a href="#" id="back-to-login">Volver a Iniciar Sesión</a>
          <span class="forgot-footer-separator">|</span>
          <a href="#" id="go-to-landing-forgot">Volver a Inicio</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Lado derecho: Carrusel de imágenes -->
  <div class="forgot-right">
    <div class="forgot-carousel-container">
      <div id="forgotBanner">
        <div class="forgot-banner-track" id="forgotBannerTrack">
          <img class="forgot-banner-slide"
            src="assets/img/npc/secundario.png?v=20251103-01"
            alt="Banner 1" />
          <img class="forgot-banner-slide" 
            src="assets/img/npc/Home_PRINCIPAL.png?v=20251030-01" 
            alt="Banner 2" />
        </div>
      </div>
    </div>
  </div>
</section>
