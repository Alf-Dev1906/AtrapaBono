<header class="dashboard-header">
    <div class="container header-content">
        <h1 class="logo" style="font-family: 'Aristotelica Display Trial', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; display: flex; align-items: center; gap: 8px;">
            <img src="assets/img/logos/LOGOTIPO_para-fondoblanco.png" alt="Atrapabono" style="width: 329.69px; height: 178.75px;" />
        </h1>
        
        <!-- Botón hamburguesa para móviles -->
        <button class="dashboard-menu-toggle" id="dashboardMenuToggle" aria-label="Abrir menú" type="button">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <nav class="user-nav">
            <a href="#" id="link-dashboard" class="nav-item">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layout-dashboard"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="17" rx="1"/></svg>
                Volver a Dashboard
            </a>
            <a href="#" id="link-payment-data" class="nav-item nav-item-disabled" style="opacity: 0.5; cursor: not-allowed;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                Datos para reservas
            </a>
            <a href="#" id="link-logout-profile" class="btn btn-secondary btn-small">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-out"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                Salir
            </a>
        </nav>
    </div>
</header>

<main class="dashboard-main container">
    <h2 class="section-title" style="font-family: 'Aristotelica Display Trial', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;">Mi Perfil</h2>
    
    <div class="card card-profile">
        <h3 class="card-title" style="font-family: 'Aristotelica Display Trial', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;">Información de Usuario y Empresa</h3>
        <div id="profile-message-area"></div>
        
        <form id="profile-form">
            <div class="form-group-readonly">
                <label>Nombre</label>
                <input type="text" id="profile-name" name="name" value="">
            </div>
            <div class="form-group-readonly">
                <label>Email</label>
                <input type="email" id="profile-email" readonly value="">
            </div>
            
            <hr>
            
            <div class="form-group">
                <label for="profile-company">Nombre de la Empresa</label>
                <input type="text" id="profile-company" name="company_name" required value="">
            </div>
            <div class="form-group">
                <label for="profile-phone">Número de Teléfono</label>
                <input type="tel" id="profile-phone" name="phone_number" value="">
            </div>
            <div class="form-group">
                <label for="profile-country">País</label>
                <input type="text" id="profile-country" name="country" value="">
            </div>

            <div style="display: flex !important; justify-content: center !important; width: 100%; margin-top: 10px;">
                <button type="submit" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    Guardar Cambios
                </button>
            </div>
        </form>
    </div>

</main>
