<header class="dashboard-header">
    <div class="container header-content">
        <h1 class="logo" style="font-family: 'Aristotelica Display Trial', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; display: flex; align-items: center; gap: 8px;">
            <img src="assets/img/logos/LOGOTIPO_para-fondoblanco.png" alt="Atrapabono" style="width: 329.69px; height: 178.75px;" />
        </h1>
    </div>
</header>

<main class="dashboard-main container">
    <div class="setup-container">
        <div class="setup-card">
            <div class="setup-header">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="setup-icon">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <h2 class="setup-title" style="font-family: 'Aristotelica Display Trial', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;">¡Bienvenido!</h2>
                <p class="setup-subtitle">Por favor configura tu contraseña para completar tu registro</p>
            </div>

            <div id="setup-message-area"></div>

            <form id="setup-password-form">
                <div class="form-group">
                    <label for="setup-email">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="setup-email" 
                        name="email" 
                        class="form-input" 
                        readonly 
                        style="background-color: #f5f5f5;"
                    />
                </div>

                <div class="form-group">
                    <label for="setup-password">Nueva Contraseña</label>
                    <input 
                        type="password" 
                        id="setup-password" 
                        name="password" 
                        class="form-input" 
                        placeholder="Mínimo 6 caracteres"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="setup-confirm-password">Confirmar Contraseña</label>
                    <input 
                        type="password" 
                        id="setup-confirm-password" 
                        name="confirm_password" 
                        class="form-input" 
                        placeholder="Repite tu contraseña"
                        required
                    />
                </div>

                <div style="display: flex !important; justify-content: center !important; width: 100%; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        Configurar Contraseña
                    </button>
                </div>
            </form>

            <div class="setup-footer">
                <p style="font-size: 14px; color: #666;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;">
                        <circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/>
                    </svg>
                    Tu contraseña debe tener al menos 6 caracteres y será encriptada de forma segura
                </p>
            </div>
        </div>
    </div>
</main>
